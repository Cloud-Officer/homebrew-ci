# HAND-MAINTAINED — intentionally NOT generated by github-build. github-build
# has no Homebrew language, so the formulae this tap ships are never installed,
# audited or tested by the generated build.yml. These jobs do that on macOS.
# Job names are static because github-build's augment_required_status_checks
# reads the literal `name:` field to keep them required across regenerations;
# a matrix would register an unexpanded ${{ matrix.* }} as a required check.
---
name: Smoke
'on':
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
  push:
    branches:
    - master
permissions:
  contents: read
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  soup:
    name: Formula soup
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Tap the working copy
      shell: bash
      run: |
        set -euo pipefail
        tap="$(brew --repository)/Library/Taps/cloud-officer/homebrew-ci"
        mkdir -p "$(dirname "${tap}")"
        ln -s "${GITHUB_WORKSPACE}" "${tap}"
        brew tap | grep -qx cloud-officer/ci \
          || { echo "::error::working copy did not register as cloud-officer/ci"; exit 1; }
    # `--except=style` runs every audit method while skipping the RuboCop cops.
    # Homebrew's cops require double-quoted strings; this repo's .rubocop.yml sets
    # EnabledByDefault (single quotes) and its rubocop job is the merge gate, so
    # the two can never both be satisfied. The audit methods are the real check.
    - name: Audit
      shell: bash
      run: brew audit --except=style --formula cloud-officer/ci/soup
    - name: Build from source
      shell: bash
      run: brew install --build-from-source cloud-officer/ci/soup
    - name: Test
      shell: bash
      run: brew test cloud-officer/ci/soup

  githubbuild:
    name: Formula githubbuild
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Tap the working copy
      shell: bash
      run: |
        set -euo pipefail
        tap="$(brew --repository)/Library/Taps/cloud-officer/homebrew-ci"
        mkdir -p "$(dirname "${tap}")"
        ln -s "${GITHUB_WORKSPACE}" "${tap}"
        brew tap | grep -qx cloud-officer/ci \
          || { echo "::error::working copy did not register as cloud-officer/ci"; exit 1; }
    - name: Audit
      shell: bash
      run: brew audit --except=style --formula cloud-officer/ci/githubbuild
    - name: Build from source
      shell: bash
      run: brew install --build-from-source cloud-officer/ci/githubbuild
    - name: Test
      shell: bash
      run: brew test cloud-officer/ci/githubbuild

  citools:
    name: Formula citools
    runs-on: macos-latest
    # citools depends on 13 formulae (swiftlint, pmd, ktlint, awscli, ...), so a
    # cold runner spends most of this job pouring bottles rather than building.
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Tap the working copy
      shell: bash
      run: |
        set -euo pipefail
        tap="$(brew --repository)/Library/Taps/cloud-officer/homebrew-ci"
        mkdir -p "$(dirname "${tap}")"
        ln -s "${GITHUB_WORKSPACE}" "${tap}"
        brew tap | grep -qx cloud-officer/ci \
          || { echo "::error::working copy did not register as cloud-officer/ci"; exit 1; }
    - name: Audit
      shell: bash
      run: brew audit --except=style --formula cloud-officer/ci/citools
    - name: Build from source
      shell: bash
      run: brew install --build-from-source cloud-officer/ci/citools
    - name: Test
      shell: bash
      run: brew test cloud-officer/ci/citools
